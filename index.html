<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mdqp — Markdown 快速剪贴板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ====== 顶部导航 ====== -->
  <nav class="topbar">
    <div class="brand"><span class="logo">📋</span> mdqp</div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <!-- ====== 未登录：欢迎页 ====== -->
  <div id="view-welcome" class="view active">
    <div class="hero">
      <h1>Markdown 快速剪贴板</h1>
      <p class="hero-sub">快速新建、编辑、分享你的 Markdown 剪贴板。<br>支持 cpoauth 一键登录，或手动注册（⚠️ 不安全）。</p>

      <!-- cpoauth 登录 -->
      <button class="btn btn-primary btn-lg" onclick="cpoauthLogin()">
        🔑 用 CP OAuth 登录（推荐）
      </button>

      <div class="divider-text"><span>或者</span></div>

      <!-- 手动注册/登录 -->
      <div class="auth-card warn">
        <div class="warn-title">⚠️ 手动注册 / 登录（不安全）</div>
        <p class="warn-desc">此方式将你的用户名和密码哈希直接存储在公开仓库中，<strong>不具备真实安全性</strong>。仅建议用于测试。</p>
        <div class="form-row">
          <input type="text" id="regUser" placeholder="用户名" class="input">
          <input type="password" id="regPass" placeholder="密码" class="input">
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="doRegister()">注册</button>
          <button class="btn btn-outline" onclick="doLogin()">登录</button>
        </div>
        <div id="authMsg" class="msg"></div>
      </div>

      <!-- 连接设置 -->
      <details class="settings-accordion">
        <summary>⚙️ 连接设置（GitHub，读写剪贴板需要）</summary>
        <div class="settings-body">
          <label>GitHub 用户名</label><input type="text" id="cfgUser" class="input" placeholder="yanzien">
          <label>仓库名</label><input type="text" id="cfgRepo" class="input" placeholder="mdqp">
          <label>分支</label><input type="text" id="cfgBranch" class="input" placeholder="main">
          <label>PAT（Personal Access Token，需要 repo 权限）</label><input type="password" id="cfgPat" class="input" placeholder="ghp_...">
          <label>数据目录（仓库内路径）</label><input type="text" id="cfgDataDir" class="input" placeholder="data" value="data">
          <div class="btn-row">
            <button class="btn btn-sm" onclick="saveConfig()">保存配置</button>
            <button class="btn btn-sm btn-outline" onclick="testConn()">测试连接</button>
          </div>
          <div id="connMsg" class="msg"></div>
        </div>
      </details>
    </div>
  </div>

  <!-- ====== 已登录：仪表盘 ====== -->
  <div id="view-dashboard" class="view">
    <div class="dash-header">
      <div>
        <h2 id="dashTitle">我的剪贴板</h2>
        <p class="muted" id="dashSub">快速管理你的 Markdown 剪贴板</p>
      </div>
      <button class="btn btn-primary" onclick="newClip()">+ 新建剪贴板</button>
    </div>

    <!-- 搜索/筛选 -->
    <div class="toolbar">
      <input type="text" id="searchInput" class="input" placeholder="搜索剪贴板..." oninput="renderClips()">
      <select id="filterSelect" class="input select" onchange="renderClips()">
        <option value="all">全部</option>
        <option value="mine">我的</option>
        <option value="public">公开的</option>
      </select>
    </div>

    <!-- 剪贴板列表 -->
    <div id="clipList" class="clip-list">
      <div class="empty-state">加载中...</div>
    </div>
  </div>

  <!-- ====== 编辑器视图 ====== -->
  <div id="view-editor" class="view">
    <div class="editor-header">
      <button class="btn btn-sm btn-outline" onclick="backToDash()">← 返回</button>
      <div class="editor-actions">
        <button class="btn btn-sm btn-outline" onclick="togglePreview()">👁 预览</button>
        <button class="btn btn-sm btn-primary" onclick="saveClip()">💾 保存</button>
      </div>
    </div>
    <input type="text" id="editTitle" class="input title-input" placeholder="标题（可选）">
    <div class="editor-body">
      <textarea id="editContent" class="editor-textarea" placeholder="在这里输入 Markdown 内容..."></textarea>
      <div id="editPreview" class="editor-preview hidden"></div>
    </div>
    <div class="editor-footer">
      <label>
        <input type="checkbox" id="editPublic"> 公开（其他人可见）
      </label>
      <span class="muted" id="editMeta"></span>
    </div>
  </div>

  <!-- ====== 查看视图（只读预览） ====== -->
  <div id="view-viewer" class="view">
    <div class="viewer-header">
      <button class="btn btn-sm btn-outline" onclick="backToDash()">← 返回</button>
      <h2 id="viewerTitle"></h2>
    </div>
    <div id="viewerBody" class="viewer-body markdown-body"></div>
    <div class="viewer-footer muted" id="viewerMeta"></div>
  </div>

  <!-- ====== Toast ====== -->
  <div id="toast" class="toast hidden"></div>

</div>

<!-- marked.js for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
