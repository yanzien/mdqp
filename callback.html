<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录中 - mdqp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#e0e0e0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:48px 40px}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#4a9eff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{font-size:18px;margin-bottom:8px}
p{color:#888;font-size:14px}
.err{color:#f66;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2 id="status">正在完成登录...</h2>
  <p id="detail">请稍候</p>
  <div id="err" class="err"></div>
</div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const code = p.get('code');
  const err = p.get('error');

  if (err) {
    document.getElementById('status').textContent = '登录失败';
    document.getElementById('detail').textContent = err + (p.get('error_description') || '');
    return;
  }

  if (!code) {
    document.getElementById('status').textContent = '缺少授权码';
    document.getElementById('err').textContent = 'OAuth 回调未收到 code 参数，请重新登录。';
    return;
  }

  // 从 sessionStorage 取回 PKCE verifier
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier) {
    document.getElementById('status').textContent = '会话已过期';
    document.getElementById('err').textContent = 'PKCE verifier 丢失，请重新登录。';
    return;
  }

  // 换 token
  const CLIENT_ID = 'ed88ee46-4e48-8e57-a71f-f00438af630';
  const REDIRECT = location.origin + location.pathname;

  fetch('https://www.cpoauth.com/api/oauth/token', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT,
      client_id: CLIENT_ID,
      code_verifier: verifier
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) {
      throw new Error(data.error_description || data.error);
    }
    // 获取用户信息
    return fetch('https://www.cpoauth.com/api/oauth/userinfo', {
      headers: {'Authorization': 'Bearer ' + data.access_token}
    }).then(r => r.json()).then(user => ({token: data, user}));
  })
  .then(({token, user}) => {
    // 存储会话
    sessionStorage.setItem('mdqp_session', JSON.stringify({
      provider: 'cpoauth',
      sub: user.sub,
      username: user.username,
      display_name: user.display_name || user.username,
      avatar: user.avatar_url || '',
      access_token: token.access_token,
      refresh_token: token.refresh_token || '',
      expires_at: Date.now() + (token.expires_in || 3600) * 1000
    }));
    // 清理 PKCE
    sessionStorage.removeItem('pkce_verifier');
    // 跳转首页
    location.href = location.origin + '/mdqp/';
  })
  .catch(e => {
    document.getElementById('status').textContent = '登录出错';
    document.getElementById('err').textContent = e.message;
  });
})();
</script>
</body>
</html>
